<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#091A2C"/>
      <stop offset="0.55" stop-color="#0E3836"/>
      <stop offset="1" stop-color="#145754"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CE4D0"/>
      <stop offset="1" stop-color="#38BDA6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDD498"/>
      <stop offset="1" stop-color="#C79A47"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#glow)"/>
  <!-- 左段（上移） -->
  <rect x="88" y="202" width="150" height="59" rx="26.6" fill="url(#teal)"/>
  <!-- 右段（下移） -->
  <rect x="274" y="298" width="150" height="59" rx="26.6" fill="url(#teal)"/>
  <!-- 金色斜缝 -->
  <polygon points="238,202 274,251 274,310 238,261" fill="url(#gold)"/>
  <!-- 右下金点 -->
  <circle cx="395" cy="371" r="8.7" fill="#EDD498" fill-opacity="0.95"/>
</svg>

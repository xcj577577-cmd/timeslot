name: CountdownWidget
options:
  bundleIdPrefix: com.xianz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 4FKFDX48HX
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
    ALWAYS_SEARCH_USER_PATHS: false
    CURRENT_PROJECT_VERSION: "49"
    MARKETING_VERSION: "2.0.0"
targets:
  CountdownWidget:
    type: application
    platform: macOS
    sources:
      - path: Sources/CountdownWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xianz.countdownwidget
        PRODUCT_NAME: 时隙
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: AppBundle/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppBundle/CountdownWidget.entitlements
        ENABLE_APP_SANDBOX: true
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    dependencies:
      - target: CountdownDesktopWidget
        embed: true
  CountdownDesktopWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: WidgetExtension
        excludes:
          - Info.plist
          - CountdownDesktopWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xianz.countdownwidget.desktop-widget
        PRODUCT_NAME: CountdownDesktopWidget
        INFOPLIST_FILE: WidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/CountdownDesktopWidget.entitlements
        ENABLE_APP_SANDBOX: true
        ENABLE_HARDENED_RUNTIME: true
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../Frameworks"
schemes:
  CountdownWidget:
    build:
      targets:
        CountdownWidget: all
        CountdownDesktopWidget: all
    run:
      config: Debug
    archive:
      config: Release
